name: Production Chat Smoke Check

on:
  schedule:
    - cron: '17 9 * * *'
      timezone: America/New_York
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-chat-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm install or Groq secrets: exercise the same endpoint visitors use.
      - name: Check live chatbot
        run: npm run test:smoke:chat
